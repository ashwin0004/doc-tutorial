<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 517">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <rect width="400" height="517" fill="url(#bgGrad)"/>
  
  <!-- Slide Screen Frame -->
  <rect x="30" y="50" width="340" height="195" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Slide Header Badge -->
  <rect x="50" y="75" width="80" height="18" rx="9" fill="url(#cardGrad)"/>
  <text x="90" y="88" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">KEYNOTE</text>
  
  <!-- Slide Content Lines -->
  <text x="50" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">
    AI SLIDESHOW
  </text>
  <text x="50" y="148" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">
    Interactive Multiplayer PPT
  </text>

  <!-- Metric Badges inside Slide -->
  <rect x="50" y="170" width="75" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="87" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f97316" text-anchor="middle">10x</text>
  <text x="87" y="210" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">FASTER</text>

  <rect x="135" y="170" width="75" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="172" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">LIVE</text>
  <text x="172" y="210" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">SYNC</text>

  <rect x="220" y="170" width="75" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="257" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4ade80" text-anchor="middle">AI</text>
  <text x="257" y="210" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">POWERED</text>

  <!-- PPT Big Title Below -->
  <text x="40" y="320" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    PRESENTATION
  </text>
  <text x="40" y="355" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#f97316">
    DECK (PPT)
  </text>
  
  <text x="40" y="410" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">
    Full PPT editor with AI generator,
  </text>
  <text x="40" y="430" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">
    visual drag &amp; drop, code mode,
  </text>
  <text x="40" y="450" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">
    and multiplayer co-authoring.
  </text>
  
  <rect x="40" y="475" width="120" height="24" rx="4" fill="#f97316"/>
  <text x="100" y="491" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">START PPT</text>
</svg>
